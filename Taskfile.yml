version: "3"

tasks:
  default:
    cmd: task --list

  dev:
    desc: Open the graphs in LangGraph Studio
    cmd: uv run langgraph dev

  router:
    desc: Run the router pattern
    cmd: uv run patterns/router/graph.py

  rerank:
    desc: Run the rerank pattern
    cmd: uv run patterns/rerank/graph.py
